<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      const storedTheme = localStorage.getItem("weather-theme");
      if (storedTheme === "light" || storedTheme === "dark") {
        document.documentElement.dataset.theme = storedTheme;
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-title">
        <p class="eyebrow" id="selected-location-name">Bucharest, Romania</p>
        <h1>Weather Now</h1>
      </div>
      <div class="header-actions">
        <div class="location-picker" id="location-picker">
          <button class="location-trigger" id="location-trigger" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="location-popover">
            Change location
          </button>
          <div class="location-popover" id="location-popover" role="dialog" aria-label="Choose a location" hidden>
            <label class="location-label" for="location-search">Search for a city or place</label>
            <input id="location-search" class="location-search" type="search" role="combobox" autocomplete="off" aria-autocomplete="list" aria-controls="location-results" aria-expanded="false" aria-activedescendant="" />
            <p class="picker-status" id="search-status" role="status" aria-live="polite">Type at least 2 characters to search.</p>
            <div class="picker-section-label">Always available</div>
            <button class="location-option permanent-location" id="bucharest-option" type="button">Bucharest, Romania</button>
            <div class="picker-section-label">Search results</div>
            <div class="location-results" id="location-results" role="listbox" aria-label="Location search results"></div>
            <button class="device-location" id="device-location" type="button">Use my location</button>
            <div id="device-suggestion" class="device-suggestion" hidden></div>
            <p class="picker-status" id="geolocation-status" role="status" aria-live="polite"></p>
            <p class="picker-status selection-status" id="selection-status" role="status" aria-live="polite"></p>
          </div>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to light theme">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
        <span id="theme-toggle-label">Dark</span>
        </button>
      </div>
    </header>

    <main class="dashboard">
      <section class="current-panel" aria-labelledby="current-heading">
        <div>
          <p class="section-label" id="current-heading">Current Conditions</p>
          <p class="updated-status" id="updated-status">Loading weather data...</p>
        </div>
        <div class="current-metrics">
          <article class="metric-tile" aria-live="polite">
            <span class="metric-tile__label">Temperature</span>
            <strong class="metric-tile__value" id="current-temp">--</strong>
          </article>
          <article class="metric-tile" aria-live="polite">
            <span class="metric-tile__label">UV Index</span>
            <strong class="metric-tile__value" id="current-uv">--</strong>
          </article>
        </div>
      </section>

      <section class="charts-grid" aria-label="Hourly weather charts">
        <article class="chart-panel">
          <div class="chart-panel__header">
            <div>
              <p class="section-label">Hourly Temperature</p>
              <h2>Temperature</h2>
            </div>
            <div class="chart-readout" aria-live="polite">
              <span id="temperature-readout-time">--</span>
              <strong id="temperature-readout-value">--</strong>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="temperature-chart" aria-label="Hourly temperature chart" role="img"></canvas>
          </div>
        </article>

        <article class="chart-panel">
          <div class="chart-panel__header">
            <div>
              <p class="section-label">Hourly UV</p>
              <h2>UV Index</h2>
            </div>
            <div class="chart-readout" aria-live="polite">
              <span id="uv-readout-time">--</span>
              <strong id="uv-readout-value">--</strong>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="uv-chart" aria-label="Hourly UV index chart" role="img"></canvas>
          </div>
        </article>
      </section>

      <section class="attribution" aria-label="Weather attribution">
        <a id="weather-source-link" href="https://open-meteo.com/" rel="noopener noreferrer">
          Weather data by Open-Meteo
        </a>
      </section>
    </main>

  </body>
</html>
